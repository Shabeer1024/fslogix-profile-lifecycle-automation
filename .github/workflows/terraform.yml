name: Terraform

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Screenshots/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Screenshots/**"
  workflow_dispatch:
    inputs:
      destroy:
        description: "Type DESTROY to run terraform destroy"
        required: false
        default: ""

# ── Least-privilege permissions ───────────────────────────────────────────────
permissions:
  id-token: write       # OIDC token for Azure federated auth
  contents: read
  pull-requests: write  # Post plan comments on PRs

# ── Shared env vars injected into every job ───────────────────────────────────
env:
  TF_VERSION: "1.9.5"
  # Terraform Cloud auth — token is stored as a GitHub secret
  TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
  # AzureRM OIDC auth — no long-lived client secret stored anywhere
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

# ── Cancel any in-flight run for the same branch/PR on new push ───────────────
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # JOB 1 — Lint, validate, plan, and comment on PR
  # ============================================================================
  plan:
    name: "Lint · Validate · Plan"
    runs-on: ubuntu-latest

    outputs:
      fmt_outcome:      ${{ steps.fmt.outcome }}
      validate_outcome: ${{ steps.validate.outcome }}
      plan_outcome:     ${{ steps.plan.outcome }}
      plan_stdout:      ${{ steps.plan.outputs.stdout }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Azure OIDC login (required by azurerm provider even for plan) ───────
      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true   # wraps stdout/stderr for step outputs
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # ── Format check ────────────────────────────────────────────────────────
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true  # report but don't block; treat as warning

      # ── Init (authenticates to Terraform Cloud for remote state) ─────────
      - name: Terraform Init
        id: init
        run: terraform init -input=false

      # ── Validate HCL syntax and module schema ───────────────────────────────
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # ── Plan ────────────────────────────────────────────────────────────────
      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_admin_source_ip: ${{ secrets.ADMIN_SOURCE_IP }}
        continue-on-error: true  # capture output even on failure

      # ── Post a rich comment on every PR ─────────────────────────────────────
      - name: Post Plan Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt      = '${{ steps.fmt.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const plan     = '${{ steps.plan.outcome }}';

            const icon = (s) => s === 'success' ? '✅' : s === 'failure' ? '❌' : '⚠️';

            const body = [
              `### Terraform Plan — \`${{ github.event.pull_request.head.sha }}\``,
              '',
              `| Step | Result |`,
              `|------|--------|`,
              `| Format check | ${icon(fmt)} \`${fmt}\` |`,
              `| Validate     | ${icon(validate)} \`${validate}\` |`,
              `| Plan         | ${icon(plan)} \`${plan}\` |`,
              '',
              '<details><summary>📋 Full plan output (click to expand)</summary>',
              '',
              '```hcl',
              process.env.PLAN_STDOUT || '(no output)',
              '```',
              '',
              '</details>',
              '',
              `> **Branch:** \`${{ github.head_ref }}\`  |  **Actor:** @${{ github.actor }}  |  **Workflow:** \`${{ github.workflow }}\``,
            ].join('\n');

            // Delete previous bot comment on this PR before posting a fresh one
            const { data: comments } = await github.rest.issues.listComments({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Terraform Plan')
            );
            if (prev) {
              await github.rest.issues.deleteComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: prev.id,
              });
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # ── Fail the job if plan or validate failed ──────────────────────────────
      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure' || steps.validate.outcome == 'failure'
        run: |
          echo "::error::Terraform plan or validate step failed — see output above."
          exit 1

  # ============================================================================
  # JOB 2 — Security scan (runs in parallel with plan, non-blocking for lab)
  # ============================================================================
  security-scan:
    name: "Security Scan (tfsec)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true          # findings shown but don't block the pipeline
          additional_args: >-
            --exclude-downloaded-modules
            --format lovely

  # ============================================================================
  # JOB 3 — Apply (main branch only, requires GitHub Environment approval)
  # ============================================================================
  apply:
    name: "Apply"
    runs-on: ubuntu-latest
    needs: [plan, security-scan]

    # Only run on direct pushes to main (not PRs, not other branches)
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    # Requires a reviewer to approve in the GitHub "production" Environment
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_admin_source_ip: ${{ secrets.ADMIN_SOURCE_IP }}

  # ============================================================================
  # JOB 4 — Destroy (manual workflow_dispatch only, double-confirmed by input)
  # ============================================================================
  destroy:
    name: "Destroy (manual only)"
    runs-on: ubuntu-latest
    needs: []

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.destroy == 'DESTROY'

    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure OIDC Login
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false
        env:
          TF_VAR_admin_source_ip: ${{ secrets.ADMIN_SOURCE_IP }}
